name: Release

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write
  id-token: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_time: ${{ steps.version.outputs.build_time }}
      git_commit: ${{ steps.version.outputs.git_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version info
        id: version
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG_NAME#v}"

          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_time=${{ github.event.release.created_at }}" >> $GITHUB_OUTPUT
          echo "git_commit=${{ github.sha }}" >> $GITHUB_OUTPUT

  build-binaries:
    name: Build Binaries
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build Binaries
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD_TIME: ${{ needs.setup.outputs.build_time }}
          GIT_COMMIT: ${{ needs.setup.outputs.git_commit }}
        run: |
          mkdir -p dist

          # Build for multiple platforms
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          binaries=(
            "godnscli:./cmd/godnscli"
            "godns:./cmd/godns"
          )

          for binary_info in "${binaries[@]}"; do
            IFS=':' read -r binary_name binary_path <<< "$binary_info"
            
            for platform in "${platforms[@]}"; do
              IFS='/' read -r -a array <<< "$platform"
              GOOS="${array[0]}"
              GOARCH="${array[1]}"
              
              output_name="${binary_name}-${VERSION}-${GOOS}-${GOARCH}"
              if [ "$GOOS" = "windows" ]; then
                output_name="${output_name}.exe"
              fi
              
              echo "Building $binary_name for $GOOS/$GOARCH..."
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
                -trimpath \
                -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.gitCommit=${GIT_COMMIT}" \
                -o "dist/${output_name}" \
                "${binary_path}"
              
              # Create checksums
              if [ "$GOOS" = "windows" ]; then
                (cd dist && sha256sum "${output_name}" > "${output_name}.sha256")
              else
                # Create tar.gz for non-Windows platforms
                tar -czf "dist/${output_name}.tar.gz" -C dist "${output_name}"
                rm "dist/${output_name}"
                (cd dist && sha256sum "${output_name}.tar.gz" > "${output_name}.tar.gz.sha256")
              fi
            done
          done

          # Create a combined checksums file
          (cd dist && sha256sum * > checksums.txt)

      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: dist/*
          retention-days: 1

  build-images:
    name: Build Image (${{ matrix.arch }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.setup.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.setup.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.setup.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
            type=sha,prefix=,format=short

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            BUILD_TIME=${{ needs.setup.outputs.build_time }}
            GIT_COMMIT=${{ needs.setup.outputs.git_commit }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ matrix.arch }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  package-helm:
    name: Package Helm Chart
    needs: [setup, build-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Update and Package Chart
        run: |
          set -e

          VERSION=${{ needs.setup.outputs.version }}

          if [ -z "$VERSION" ]; then
            echo "Error: VERSION is empty"
            exit 1
          fi

          # Update Chart.yaml version
          sed -i "s/^version:.*/version: ${VERSION}/" charts/godns/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/godns/Chart.yaml

          # Update values.yaml with new image tag
          sed -i "s|tag:.*|tag: \"${VERSION}\"|" charts/godns/values.yaml

          mkdir -p helm-releases
          helm package charts/godns -d helm-releases

          echo "Packaged chart:"
          ls -la helm-releases

      - name: Upload Helm Chart
        uses: actions/upload-artifact@v6
        with:
          name: helm-chart
          path: helm-releases/
          if-no-files-found: error
          retention-days: 1
  release:
    name: Publish & Release
    needs: [setup, build-binaries, build-images, package-helm]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Download Helm Chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: helm-releases

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.setup.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.setup.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.setup.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
            type=sha,prefix=,format=short

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' $(ls /tmp/digests))

      - name: Push Helm Chart
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          helm push helm-releases/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm

      - name: Upload Release Assets
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            gh release upload ${{ needs.setup.outputs.tag }} dist/* helm-releases/*.tgz --clobber -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release Notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Release ${{ needs.setup.outputs.tag }}

            ### Docker Images

            **Multi-arch image (linux/amd64, linux/arm64):**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.version }}
            ```

            ### Helm Chart

            **Install via Helm:**
            ```bash
            helm install godns oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm/godns --version ${{ needs.setup.outputs.version }}
            ```

            ### CLI Binaries

            Download the appropriate binary for your platform:

            - **Linux (amd64):** `godnscli-${{ needs.setup.outputs.version }}-linux-amd64.tar.gz`
            - **Linux (arm64):** `godnscli-${{ needs.setup.outputs.version }}-linux-arm64.tar.gz`
            - **macOS (Intel):** `godnscli-${{ needs.setup.outputs.version }}-darwin-amd64.tar.gz`
            - **macOS (Apple Silicon):** `godnscli-${{ needs.setup.outputs.version }}-darwin-arm64.tar.gz`
            - **Windows (amd64):** `godnscli-${{ needs.setup.outputs.version }}-windows-amd64.exe`

            ### API Server Binaries

            Download the appropriate binary for your platform:

            - **Linux (amd64):** `godns-${{ needs.setup.outputs.version }}-linux-amd64.tar.gz`
            - **Linux (arm64):** `godns-${{ needs.setup.outputs.version }}-linux-arm64.tar.gz`
            - **macOS (Intel):** `godns-${{ needs.setup.outputs.version }}-darwin-amd64.tar.gz`
            - **macOS (Apple Silicon):** `godns-${{ needs.setup.outputs.version }}-darwin-arm64.tar.gz`
            - **Windows (amd64):** `godns-${{ needs.setup.outputs.version }}-windows-amd64.exe`

            **Verify checksums:**
            ```bash
            sha256sum -c <binary_name>-${{ needs.setup.outputs.version }}-<platform>.tar.gz.sha256
            ```

            ### Installation

            #### Using Docker:
            ```bash
            docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.version }} --version
            ```

            #### Using Kubernetes/Helm:
            ```bash
            helm install my-godns oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm/godns --version ${{ needs.setup.outputs.version }}
            ```

            #### CLI Installation (Linux amd64):
            ```bash
            curl -fL -O "https://github.com/${{ github.repository }}/releases/download/${{ needs.setup.outputs.tag }}/godnscli-${{ needs.setup.outputs.version }}-linux-amd64.tar.gz"
            tar -xzf "godnscli-${{ needs.setup.outputs.version }}-linux-amd64.tar.gz"
            chmod +x "godnscli-${{ needs.setup.outputs.version }}-linux-amd64"
            sudo mv "godnscli-${{ needs.setup.outputs.version }}-linux-amd64" /usr/local/bin/godnscli
            ```

            #### API Server Installation (Binary):
            See the [Binary Installation Guide](https://github.com/${{ github.repository }}/blob/main/docs/BINARY_INSTALLATION.md) for detailed instructions.

            ```bash
            # Linux amd64
            curl -fL -O "https://github.com/${{ github.repository }}/releases/download/${{ needs.setup.outputs.tag }}/godns-${{ needs.setup.outputs.version }}-linux-amd64.tar.gz"
            tar -xzf "godns-${{ needs.setup.outputs.version }}-linux-amd64.tar.gz"
            chmod +x "godns-${{ needs.setup.outputs.version }}-linux-amd64"
            sudo mv "godns-${{ needs.setup.outputs.version }}-linux-amd64" /usr/local/bin/godns
            ```

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: true

      - name: Security scan with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          timeout: 10m

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: steps.trivy.outcome == 'success'
        with:
          sarif_file: trivy-results.sarif

      - name: Create release summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # Release ${{ needs.setup.outputs.tag }} Published! 🎉

          ## Artifacts

          - 🐳 **Docker Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.version }}\`
          - 📦 **Helm Chart**: \`oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm/godns:${{ needs.setup.outputs.version }}\`
          - 💻 **Binaries**: CLI and API Server binaries available for Linux, macOS, and Windows

          ## Image Details

          - **Platforms**: linux/amd64, linux/arm64
          - **Base Image**: Google Distroless (Static, Debian 12)
          - **Security**: SBOM included

          ## Next Steps

          1. Test the release in your environment
          2. Update your deployment manifests
          3. Monitor for any issues

          EOF
